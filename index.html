<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="School">
<meta name="theme-color" content="#1e4d3f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f2; --paper:#ffffff; --ink:#17201c; --muted:#5e6a64; --line:#dde3de;
  --today:#1e4d3f; --today-ink:#f2f7f4; --today-muted:#b9d3c8;
  --tomorrow:#e2ece6; --focus:#2e7bd6;
  --quiz:#ffe7a1; --quiz-ink:#5c4500; --off:#d6eedd; --off-ink:#1f5a35; --due:#fad6cf; --due-ink:#7d2614;
  --grace:#2e7bd6; --anna:#9b4dca; --elle:#d08a10;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --paper:#1b211e; --ink:#e9efeb; --muted:#9aa8a1; --line:#2c3531;
  --today:#24584a; --today-ink:#f2f7f4; --today-muted:#a9c9bb; --tomorrow:#1f2b26;
  --quiz:#4a3d10; --quiz-ink:#ffe39a; --off:#183a26; --off-ink:#a9e2bd; --due:#4a2119; --due-ink:#ffc2b5;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 48px;overflow-x:clip}
.t,.det,.orig,.summary{overflow-wrap:anywhere}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

header{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px}
header h1{font-size:28px;margin:0;letter-spacing:-.01em}
header .stamp{color:var(--muted);font-size:14px}
.summary{font-size:18px;line-height:1.45;margin:0 2px 20px}

section{margin:0 0 22px}
section > h2{font-size:20px;margin:0 2px 8px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:4px 14px}

/* Today: the one bold thing */
.today{background:var(--today);color:var(--today-ink);border-radius:20px;padding:16px 16px 6px;margin:0 0 14px;display:grid;grid-template-columns:74px 1fr;gap:4px 14px}
.today .date{grid-row:span 2;text-align:center;border-right:1px solid rgba(255,255,255,.18);padding-right:12px}
.today .date b{display:block;font-size:52px;line-height:1;font-weight:700;letter-spacing:-.02em}
.today .date span{display:block;font-size:15px;color:var(--today-muted)}
.today h2{font-size:20px;margin:2px 0 0}
.today .list{min-width:0}
.today .item{border-color:rgba(255,255,255,.14)}
.today .who,.today .det,.today .meta{color:var(--today-muted)}
.today .x{color:var(--today-muted)}
.today .empty{color:var(--today-muted)}
.tomorrow{background:var(--tomorrow);border-radius:18px;padding:12px 14px 4px;margin:0 0 14px}
.tomorrow h2{font-size:19px;margin:0 0 2px}
.tomorrow .item{border-color:rgba(0,0,0,.07)}

/* items */
.item{position:relative;padding:12px 30px 12px 0;border-top:1px solid var(--line)}
.list > .item:first-child,.list > .day:first-child + .item{border-top:0}
.row{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.row .body{flex:1;min-width:0}
.t{font-weight:700;font-size:17.5px;line-height:1.35}
.who{display:inline-flex;align-items:center;gap:5px;font-size:14.5px;color:var(--muted);margin-right:8px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:7px;margin-right:6px;vertical-align:1px}
.report{display:block;color:var(--muted);font-size:14px;padding-top:10px}
.reportbox{margin-top:8px}
.reportbox label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.reportbox textarea{width:100%;font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.en{font-size:13.5px;color:var(--muted);margin-top:1px}
.ask .en{display:block;margin-top:2px}
.kosum{background:var(--tomorrow);border-radius:10px;padding:9px 12px;margin:8px 0 6px;font-size:15.5px;line-height:1.55}
.kosum b{display:block;font-size:13.5px;color:var(--muted);margin-bottom:2px}
.today .kosum{background:rgba(255,255,255,.1)}
/* Language switch stays reachable while scrolling: pinned to the top-right corner. */
.lang{position:fixed;z-index:30;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));
  min-width:44px;height:36px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:0 12px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header{padding-right:60px}
.today .en{color:var(--today-muted)}
.tips{margin:4px 0 0;padding-left:20px;font-size:16px;line-height:1.5} .tips li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.kid .ask{margin:8px 0}
details.report{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.report summary{cursor:pointer;font-weight:700;font-size:16.5px}
details.report p{font-size:16px;margin:8px 0}
details.report .nums{color:var(--muted);font-size:14.5px}
details.report h5{font-size:14.5px;color:var(--muted);margin:10px 0 2px}
details.report ul{margin:0;padding-left:20px;font-size:15.5px}
.tag.ev-trip{background:#dcecff;color:#1d4f8f} .tag.ev-retreat{background:#e4f2e0;color:#2f5f22}
.tag.ev-sports{background:#ffe2cc;color:#8a3d06} .tag.ev-fair{background:#ece3ff;color:#4b2c8f}
.tag.ev-lunch{background:#fff0d6;color:#7a5200} .tag.ev-dress{background:#ffe0f0;color:#8f1f5a}
.tag.ev-meeting{background:#e3eaf0;color:#2f4656} .tag.ev-photo{background:#e8f4f8;color:#215c70}
.tag.ev-chapel{background:#f1ebdf;color:#5e4a22} .tag.ev-music{background:#e6e3fb;color:#3a2f8f}
.tag.ev-event{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag[class*="ev-"]{background:#2a302d;color:#d9e2dd}}
.tag.moved{background:#e3e9fb;color:#24408f} .tag.cancel{background:var(--due);color:var(--due-ink)}
.t.struck{text-decoration:line-through;color:var(--muted)}
.tag.muted{background:var(--line);color:var(--muted)}
.tag.quiz{background:var(--quiz);color:var(--quiz-ink)} .tag.off{background:var(--off);color:var(--off-ink)} .tag.due{background:var(--due);color:var(--due-ink)}
.det{color:var(--muted);font-size:15.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.open .det{display:block;-webkit-line-clamp:unset}
.det.full{display:block;-webkit-line-clamp:unset;margin:0 0 4px;color:var(--ink)}
.more{display:none;margin-top:8px}
.item.open .more{display:block}
.orig{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;color:var(--ink)}
.today .orig{background:rgba(0,0,0,.18);color:var(--today-ink)}
.orig a,.det a{color:inherit}
.meta{font-size:13.5px;color:var(--muted);margin-top:6px}
.toggle{background:none;border:0;padding:6px 0 0;color:var(--focus);font-size:15px;cursor:pointer}
.today .toggle{color:#cfe6dc}

/* remove: quiet until asked */
.x{position:absolute;top:6px;right:-8px;width:36px;height:36px;border:0;background:none;color:#a3aea8;font-size:22px;line-height:1;cursor:pointer;border-radius:50%}
.x:hover{background:rgba(0,0,0,.05)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:15px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.good{border-color:#8cc7a7}

/* week: date column on the left */
.day{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0 2px;border-top:1px solid var(--line)}
.list > .day:first-child{border-top:0}
.day .d{font-size:14px;color:var(--muted);line-height:1.2;padding-top:12px}
.day .d b{display:block;font-size:22px;color:var(--ink)}
.day .items .item:first-child{border-top:0}

/* decisions */
.task .when{font-size:14.5px;font-weight:700;color:var(--muted)}
.task .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* kids carousel */
.tabs{display:flex;gap:8px;margin:0 2px 10px}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px 6px 10px;font-size:15.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--ink);font-weight:700}
.track{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:16px;scrollbar-width:none;margin:0;padding:0 0 4px;scroll-behavior:smooth}
.track::-webkit-scrollbar{display:none}
.kid{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;border-top:6px solid}
.kid h3{font-size:22px;margin:0}
.kid .grade{color:var(--muted);font-size:14.5px;margin:0 0 8px}
.kid h4{font-size:15.5px;margin:14px 0 4px;color:var(--muted);font-weight:700}
.kid .ask{font-size:17px;line-height:1.45;margin:2px 0}
.kid .learn{font-size:16px;margin:0}
.kid .item{padding-right:0}
.kid .item .x{right:-4px}

details.later > summary{list-style:none;cursor:pointer;font-size:20px;font-weight:700;margin:0 2px 8px}
details.later > summary::-webkit-details-marker{display:none}
details.later > summary::after{content:"  ›";color:var(--muted)}
details.later[open] > summary::after{content:"  ⌄"}
.empty{color:var(--muted);font-size:16px;padding:10px 0}
.toast{position:fixed;left:16px;right:16px;max-width:528px;margin:0 auto;bottom:max(16px,env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:14px;font-size:16px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--paper);font-weight:700;font-size:16px;padding:8px 12px;border-radius:10px;cursor:pointer;text-decoration:underline}
.toast.show{opacity:1;pointer-events:auto;transform:none}
footer{color:var(--muted);font-size:14px;margin-top:26px}
.lock{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:10px}
.lock h1{font-size:30px;margin:0} .lock p{margin:0;color:var(--muted)}
.lock label{font-weight:700;margin-top:10px}
.lock input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.lock .err{color:var(--due-ink);background:var(--due);padding:8px 12px;border-radius:10px}
.lock .btn{padding:12px;font-size:17px}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}.toast{transition:none}}
</style>
</head>

const store = {
  get() { try { return JSON.parse(localStorage.getItem("school-pending") || "{}"); } catch { return {}; } },
  set(v) { try { localStorage.setItem("school-pending", JSON.stringify(v)); } catch {} },
};
// Actions the Mac hasn't applied yet: hidden here right away, cleared once the

let pending = store.get();
// Content language: Korean by default; the 한/EN choice is remembered on this phone.
let LANG = (() => { try { return localStorage.getItem("school-lang") || "ko"; } catch { return "ko"; } })();
const ko = () => LANG === "ko";
function titleHtml(r, cls = "t") {
  const struck = r.cancelled ? " struck" : "";
  if (ko() && r.title_ko && r.title_ko !== r.title)
    return `<div class="${cls}${struck}">${esc(r.title_ko)}</div><div class="en">${esc(r.title)}</div>`;
  return `<div class="${cls}${struck}">${esc(r.title)}</div>`;
}
const detailsOf = r => (ko() && r.details_ko) ? r.details_ko : r.details;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const D = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmt = (s, o) => D(s).toLocaleDateString("en-CA", o);
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };

function setup() {
  KIDS = DATA.kids;
  COLOR = Object.fromEntries(KIDS.map(k => [k.name, k.color]));
  today = iso(new Date()) > DATA.today ? iso(new Date()) : DATA.today;
  tomorrow = addDays(today, 1); weekEnd = addDays(today, 8);
  for (const [k, v] of Object.entries(pending)) if (v.at < DATA.updated) delete pending[k];
  store.set(pending);
}

// ---- passcode, decryption and the relay (WebCrypto; matches family_crypto.py) ----
const b64 = {
  dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  enc: bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))),
};
async function deriveKey(pass, saltB64, iterations) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64.dec(saltB64), iterations, hash: "SHA-256"},
                                 base, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function openBox(key, box) {
  const raw = b64.dec(box);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, key, raw.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function sealBox(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12);
  return b64.enc(out);
}
const savedPass = {
  get() { try { return localStorage.getItem("school-pass"); } catch { return null; } },
  set(v) { try { localStorage.setItem("school-pass", v); } catch {} },
};

async function unlock(pass) {
  DATA = await openBox(await deriveKey(pass, SEALED.salt, SEALED.iterations), SEALED.box);
  const relayKey = await deriveKey(pass, SEALED.relay.salt, SEALED.iterations);
  DATA.sync = {url: SEALED.relay.url, seal: obj => sealBox(relayKey, obj), open: box => openBox(relayKey, box)};
}

// Changes made on the other phone since this page was built: apply them now
// rather than waiting for the Mac to republish.
async function pullRelay() {
  if (!DATA.sync) return;
  try {
    const since = Math.floor(new Date(DATA.updated).getTime() / 1000);
    const res = await fetch(`${DATA.sync.url}/json?poll=1&since=${since}`);
    for (const line of (await res.text()).split("\n")) {
      if (!line.trim()) continue;
      const msg = JSON.parse(line);
      if (msg.event !== "message") continue;
      try {
        const c = await DATA.sync.open(msg.message);
        if (c.action === "undo") delete pending[c.key];
        else pending[c.key] = {action: c.action, at: c.at, title: c.title, kid: c.kid, shared: true};
      } catch { /* not ours or a different passcode */ }
    }
    store.set(pending);
    render();
  } catch { /* offline: show what we have */ }
}

function lockScreen(error) {
  document.getElementById("app").innerHTML = `<form class="lock" id="lock">
    <h1>School</h1><p>Enter the family passcode to open this week's school plan.</p>
    <label for="pass">Family passcode</label>
    <input id="pass" type="password" autocomplete="current-password" autofocus required>
    ${error ? `<p class="err">${esc(error)}</p>` : ""}
    <button class="btn primary" type="submit">Open</button></form>`;
  document.getElementById("lock").onsubmit = async e => {
    e.preventDefault();
    const pass = document.getElementById("pass").value;
    try { await unlock(pass); savedPass.set(pass); start(); }
    catch { lockScreen("That passcode didn't open the page. Check it and try again."); }
  };
}

function start() { setup(); render(); pullRelay(); }

async function boot() {
  if (DATA) return start();  // local preview
  const pass = savedPass.get();
  if (pass) { try { await unlock(pass); return start(); } catch { /* passcode changed */ } }
  lockScreen();
}

function who(kids) {
  if (kids.length === KIDS.length) return `<span class="who">${kids.map(k => `<span class="dot" style="background:${COLOR[k]}"></span>`).join("")} All</span>`;
  return kids.map(k => `<span class="who"><span class="dot" style="background:${COLOR[k]}"></span>${esc(k)}</span>`).join("");
}
const TAG = {quiz: '<span class="tag quiz">Quiz</span>', no_school: '<span class="tag off">No school</span>', deadline: '<span class="tag due">Due</span>'};
// Event type from fixed keyword rules (first match wins), so badges are always consistent.
const EVENT_TYPES = [
  ["trip", "Trip", /field ?trip|\btrip\b|excursion|outing/i],
  ["retreat", "Retreat", /retreat|\bcamp\b/i],
  ["sports", "Sports", /\brace\b|\bmeet\b|cross.?country|\bgame\b|tournament|\bmatch\b|tryout|track|swim|soccer|basketball|volleyball|sssaa/i],
  ["fair", "Fair", /\bfair\b|info(rmation)? (night|session)|open house|expo/i],
  ["lunch", "Lunch", /lunch|\bbbq\b|pizza|snack|bake sale/i],
  ["dress", "Dress-up", /sock|shirt day|non-?uniform|spirit|costume|pajama|dress.?(up|down)|crazy hair|farm fun/i],
  ["meeting", "Meeting", /conference|meet the teacher|parent.?teacher|interview|\bmeeting\b|orientation/i],
  ["photo", "Photos", /photo|picture day/i],
  ["chapel", "Chapel", /chapel|assembly|worship|spiritual emphasis/i],
  ["music", "Music", /concert|band|choir|recital|jazz|orchestra|music/i],
];
function eventTag(r) {
  if (r.kind !== "event") return TAG[r.kind] || "";
  const hit = EVENT_TYPES.find(([, , re]) => re.test(r.title)) || EVENT_TYPES.find(([, , re]) => re.test(r.details || ""));
  return hit ? `<span class="tag ev-${hit[0]}">${hit[1]}</span>` : '<span class="tag ev-event">Event</span>';
}

function original(src) {
  const s = DATA.sources[src];
  if (!s) return "";
  const sum = ko() && s.summary_ko ? `<div class="kosum"><b>요약</b>${esc(s.summary_ko).replace(/\n/g, "<br>")}</div>` : "";
  return `${sum}<div class="meta">${esc(fmt(s.date, {weekday: "short", month: "short", day: "numeric"}))} · ${esc(s.subject)}</div>
          <div class="orig">${linkify(s.text)}</div>`;
}

function item(r, opts = {}) {
  // Compact rows (This week, Later) show the title only; details open on tap.
  const det = detailsOf(r) ? `<div class="det">${linkify(detailsOf(r))}</div>` : "";
  const top = opts.compact ? "" : det, inMore = opts.compact ? det.replace('class="det"', 'class="det full"') : "";
  const owner = opts.kid || (r.kids.length === 1 ? r.kids[0] : null);  // kid cards pass their kid
  const removable = !opts.noRemove && !r.cancelled && (r.kind === "event" || r.kind === "quiz") && owner;
  const change = r.cancelled ? '<span class="tag cancel">Cancelled</span>'
    : r.was ? `<span class="tag moved">Moved · was ${esc(fmt(r.was, {weekday: "short", month: "short", day: "numeric"}))}</span>` : "";
  return `<div class="item" data-key="${esc(r.hkey)}">
    <div class="row" data-toggle>
      <div class="body">${who(r.kids)}${r.cancelled ? "" : eventTag(r)}${change}${titleHtml(r)}${top}</div>
    </div>
    <div class="more">${inMore}${original(r.source)}${reportLink(r.hkey, r.title, r.kids[0])}</div>
    ${removable ? `<button class="x" aria-label="Remove ${esc(r.title)}" data-remove='${esc(JSON.stringify({key: r.hkey, title: r.title, kid: owner}))}'>×</button>` : ""}
  </div>`;
}

function reportLink(key, title, kid) {
  return `<button class="toggle report" data-report='${esc(JSON.stringify({key, title, kid}))}'>Something wrong here?</button>`;
}

function task(i) {
  const when = i.due ? `by ${fmt(i.due, {weekday: "short", month: "short", day: "numeric"})}` : "Open now";
  const moved = i.was ? ` <span class="tag moved">Deadline moved · was ${esc(fmt(i.was, {month: "short", day: "numeric"}))}</span>` : "";
  const payload = esc(JSON.stringify({key: i.key, title: i.title, kid: i.kid}));
  return `<div class="item task" data-key="${esc(i.key)}">
    <div class="row" data-toggle><div class="body">${who([i.kid])}<span class="when">${esc(when)}</span>${moved}
      ${titleHtml(i)}${detailsOf(i) ? `<div class="det">${linkify(detailsOf(i))}</div>` : ""}</div></div>
    <div class="acts"><button class="btn good" data-act="done" data-p='${payload}'>Done</button>
      <button class="btn" data-act="skip" data-p='${payload}'>Skip</button>
      <button class="toggle" data-toggle-btn>Full email</button></div>
    <div class="more">${original(i.source)}${reportLink(i.key, i.title, i.kid)}</div>
  </div>`;
}

// Shown unless decided (by the Mac or on a phone); a pending "undo" brings it back.
const visible = r => {
  const p = pending[r.hkey] || pending[r.key];
  if (p) return p.action === "undo";
  return !r.status;
};

function render() {
  const rows = DATA.rows.filter(visible);
  const decide = DATA.decide.filter(visible), must = DATA.must.filter(visible);
  const on = d => rows.filter(r => r.when === d);
  const week = rows.filter(r => r.when > tomorrow && r.when < weekEnd);
  const later = rows.filter(r => r.when >= weekEnd);
  const byDay = list => {
    const days = [...new Set(list.map(r => r.when))];
    return days.map(d => `<div class="day"><div class="d">${esc(fmt(d, {weekday: "short"}))}<b>${D(d).getDate()}</b></div>
      <div class="items">${list.filter(r => r.when === d).map(r => item(r, {compact: true})).join("")}</div></div>`).join("");
  };
  const todays = on(today), tomorrows = on(tomorrow);
  const updated = new Date(DATA.updated);

  let h = `<header><h1>School</h1><span class="stamp">Updated ${esc(updated.toLocaleString("en-CA", {weekday: "short", hour: "numeric", minute: "2-digit"}))}
      <button class="lang" data-lang aria-label="Switch language">${ko() ? "EN" : "한"}</button></span></header>
    <p class="summary">${esc(ko() && DATA.summary_ko ? DATA.summary_ko : DATA.summary)}</p>`;

  if (must.length) h += `<section><h2>Must do</h2><div class="panel list">${must.map(task).join("")}</div></section>`;
  if (decide.length) h += `<section><h2>To decide</h2><div class="panel list">${decide.map(task).join("")}</div></section>`;

  h += `<div class="today"><div class="date"><b>${D(today).getDate()}</b><span>${esc(fmt(today, {weekday: "short"}))}<br>${esc(fmt(today, {month: "short"}))}</span></div>
    <h2>Today</h2><div class="list">${todays.length ? todays.map(r => item(r)).join("") : '<p class="empty">Nothing at school today.</p>'}</div></div>`;
  h += `<div class="tomorrow"><h2>Tomorrow · ${esc(fmt(tomorrow, {weekday: "long", month: "short", day: "numeric"}))}</h2>
    <div class="list">${tomorrows.length ? tomorrows.map(r => item(r)).join("") : '<p class="empty">Nothing special.</p>'}</div></div>`;
  h += `<section><h2>This week</h2><div class="panel list">${week.length ? byDay(week) : '<p class="empty">Nothing else this week.</p>'}</div></section>`;

  h += `<section><h2>Kids</h2><div class="tabs" role="tablist">${KIDS.map((k, n) =>
      `<button class="tab" role="tab" aria-selected="${n === 0}" data-tab="${n}"><span class="dot" style="background:${k.color}"></span>${esc(k.name)}</button>`).join("")}</div>
    <div class="track" id="track">${KIDS.map(k => kidCard(k, rows, decide, must)).join("")}</div></section>`;

  if (later.length) h += `<details class="later"><summary>Later this month</summary><div class="panel list">${byDay(later)}</div></details>`;
  h += historySection();
  h += `<footer>Built from ${DATA.emails_read} school emails on the family Mac. Dates are read by a small model, so open the full email before anything important.
    ${DATA.notify_topic ? `<p><b>Evening heads-up on this phone:</b> install the free <a href="https://ntfy.sh/app" target="_blank" rel="noopener">ntfy app</a>, tap +, and subscribe to <b style="user-select:all">${esc(DATA.notify_topic)}</b>. You'll get a notification at 7 PM only when tomorrow has a quiz, a day off, something to bring, or a deadline.</p>` : ""}</footer>`;
  document.getElementById("app").innerHTML = h;
}

// Done / skipped / removed: what the Mac has recorded plus taps not yet published.
function historySection() {
  const LBL = {done: "Done", skip: "Skipped", skipped: "Skipped", hide: "Removed", hidden: "Removed"};
  const seen = new Set(), rows = [];
  for (const [key, v] of Object.entries(pending)) {
    if (v.action === "undo") continue;
    seen.add(key); rows.push({key, status: v.action, title: v.title, kid: v.kid});
  }
  for (const d of DATA.decided || []) if (!seen.has(d.key) && !(pending[d.key] && pending[d.key].action === "undo")) { seen.add(d.key); rows.push({...d}); }
  // Dates come from the page's own items, so taps not yet published show them too.
  const longAgo = new Date(D(today)); longAgo.setMonth(longAgo.getMonth() - 3);
  const kept = [];
  for (const r of rows) {
    const task = [...DATA.must, ...DATA.decide].find(i => i.key === r.key);
    const ev = DATA.rows.find(x => x.hkey === r.key);
    const day = task ? task.due : ev ? ev.when : r.due;  // deadline, or the event's date
    // Drop once the deadline or event has passed; undated ones after three months.
    if (day ? day < today : (r.at || "") < iso(longAgo)) continue;
    r.date = day ? `${task || !ev ? "by" : "on"} ${fmt(day, {weekday: "short", month: "short", day: "numeric"})}`
                 : "no deadline";
    kept.push(r);
  }
  rows.length = 0; rows.push(...kept);
  if (!rows.length) return "";
  return `<details class="later history"><summary>Done, skipped &amp; removed (${rows.length})</summary><div class="panel list">${rows.map(d => {
      const p = esc(JSON.stringify({key: d.key, title: d.title, kid: d.kid}));
      const due = d.date ? ` · ${esc(d.date)}` : "";
      return `<div class="item"><div class="body">${d.kid && COLOR[d.kid] ? who([d.kid]) : ""}<span class="tag ${d.status === "done" ? "off" : "muted"}">${LBL[d.status] || d.status}</span>
        <div class="t">${esc(d.title)}</div><div class="meta">${esc(d.kid || "")}${due}</div>
        <div class="acts"><button class="btn" data-restore='${p}'>Restore</button></div></div></div>`;
    }).join("")}</div></details>`;
}

function restore(p) {
  // Undo a change: shown again here at once, and told to the Mac and the other phone.
  clearTimeout(waiting[p.key]); delete waiting[p.key];
  const wasLocalOnly = pending[p.key] && !pending[p.key].shared && !DATA.decided?.some(d => d.key === p.key);
  if (wasLocalOnly) delete pending[p.key];
  else { pending[p.key] = {action: "undo", at: new Date().toISOString(), title: p.title, kid: p.kid}; share("undo", p); }
  store.set(pending);
  render();
  toast(`Restored: ${p.title}`);
}

function kidCard(k, rows, decide, must) {
  const mine = rows.filter(r => r.kids.includes(k.name) && r.when < weekEnd);
  const tasks = [...must, ...decide].filter(i => i.kid === k.name);
  const mem = (DATA.memory || {})[k.name] || {};
  const week = mem.week, month = mem.month, prof = mem.profile || {};
  const L = (o, key) => o && ((!ko() && o[key + "_en"] && o[key + "_en"].length) ? o[key + "_en"] : o[key]);
  const learn = (week && week.learned && week.learned.length) ? L(week, "learned")
    : (ko() && DATA.learning_ko && DATA.learning_ko[k.name]) || DATA.learning[k.name] || [];

  // Dinner: the week's questions from the school memory, else the single daily one.
  // Both languages in either mode: the chosen one first, the other underneath.
  let asks = (week && week.dinner_questions || []).map(q => ko()
      ? `${esc(q.ko)}<span class="en">${esc(q.en)}</span>`
      : `${esc(q.en)}${q.ko ? `<span class="en">${esc(q.ko)}</span>` : ""}`);
  if (!asks.length && DATA.dinner[k.name]) {
    const koQ = DATA.dinner_ko && DATA.dinner_ko[k.name];
    asks = [ko() && koQ ? `${esc(koQ)}<span class="en">${esc(DATA.dinner[k.name])}</span>`
                       : `${esc(DATA.dinner[k.name])}${koQ ? `<span class="en">${esc(koQ)}</span>` : ""}`];
  }
  const chips = (prof.activities || []).map(a => `<span class="chip">${esc(a)}</span>`).join("");
  const report = month ? `<details class="report"><summary>${esc((!ko() && month.title_en) || month.title_ko || month.month)} <span class="meta">· ${esc(month.month)} report</span></summary>
      <p>${esc((!ko() && month.overview_en) || month.overview_ko || "")}</p>
      <p class="nums">Quizzes ${month.numbers?.quizzes ?? 0} · Events ${month.numbers?.events ?? 0} · Forms & decisions ${month.numbers?.forms_and_decisions ?? 0} · Days off ${month.numbers?.days_off ?? 0}</p>
      ${list("Learned", L(month, "learning"))}${list("Highlights", L(month, "highlights"))}${list("For parents", L(month, "for_parents"))}${list("Coming up", L(month, "looking_ahead"))}
    </details>` : "";
  return `<article class="kid" style="border-top-color:${k.color}" aria-label="${esc(k.name)}">
    <h3>${esc(k.name)}</h3><p class="grade">${esc(k.grade)}</p>${chips ? `<div class="chips">${chips}</div>` : ""}
    ${week && week.summary_ko ? `<h4>This week${week.partial ? " so far" : ""}</h4><p class="learn">${esc((!ko() && week.summary_en) || week.summary_ko)}</p>` : ""}
    ${(week && L(week, "for_parents") || []).length ? `<h4>For parents</h4><ul class="tips">${L(week, "for_parents").slice(0, 4).map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    ${asks.length ? `<h4>Ask at dinner</h4>${asks.map(a => `<p class="ask">💬 ${a}</p>`).join("")}` : ""}
    <h4>Next 7 days</h4><div class="list">${mine.length ? mine.map(r => `<div class="day"><div class="d">${esc(fmt(r.when, {weekday: "short"}))}<b>${D(r.when).getDate()}</b></div>
      <div class="items">${item({...r, kids: r.kids.length === KIDS.length ? r.kids : []}, {kid: k.name})}</div></div>`).join("") : '<p class="empty">Nothing dated.</p>'}</div>
    ${tasks.length ? `<h4>Open</h4>${tasks.map(i => `<p class="learn">${esc(ko() && i.title_ko ? i.title_ko : i.title)}${i.due ? ` · by ${esc(fmt(i.due, {month: "short", day: "numeric"}))}` : ""}</p>`).join("")}` : ""}
    ${learn.length ? `<h4>Learning now</h4><p class="learn">${esc(learn.join(", "))}</p>` : ""}
    ${report}
  </article>`;
}

function list(title, items) {
  return items && items.length ? `<h5>${esc(title)}</h5><ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
}

const UNDO_MS = 6000;
const LABEL = {done: "Marked done", skip: "Skipped", hide: "Removed"};
const waiting = {};  // key -> timer: changes still inside their undo window

function toast(msg, undo) {
  const t = document.getElementById("toast");
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Undo</button>' : ""}`;
  if (undo) t.querySelector("button").onclick = undo;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), undo ? UNDO_MS : 2600);
}

// Done / Skip / Remove: hidden here at once, shared only after the undo window.
function send(action, p) {
  pending[p.key] = {action, at: new Date().toISOString(), title: p.title, kid: p.kid};
  store.set(pending);
  render();
  clearTimeout(waiting[p.key]);
  waiting[p.key] = setTimeout(() => { delete waiting[p.key]; share(action, p); }, UNDO_MS);
  toast(`${LABEL[action]}: ${p.title}`, () => {
    clearTimeout(waiting[p.key]); delete waiting[p.key];
    delete pending[p.key]; store.set(pending); render();
    toast(`Restored: ${p.title}`);
  });
}

// Tells the family Mac (and the other phone) about a change. Wired to the
// encrypted relay once publishing is set up; in this preview it stays on this device.
async function post(obj) {
  if (!DATA || !DATA.sync) return false;
  try {
    await fetch(DATA.sync.url, {method: "POST", body: await DATA.sync.seal({...obj, at: new Date().toISOString()})});
    return true;
  } catch { return false; }
}
function share(action, p) { return post({action, key: p.key, title: p.title, kid: p.kid}); }

// Page errors reach the family Mac's log (a few per visit at most).
let errorsSent = 0;
function reportError(message, where) {
  if (errorsSent++ >= 3) return;
  post({action: "error", message: String(message).slice(0, 300), where: String(where || "").slice(0, 300),
        agent: navigator.userAgent.slice(0, 160)});
}
addEventListener("error", e => reportError(e.message, `${e.filename}:${e.lineno}`));
addEventListener("unhandledrejection", e => reportError(e.reason && (e.reason.message || e.reason), "promise"));

// Leaving the page during the undo window still shares the change.
addEventListener("pagehide", () => {
  for (const key of Object.keys(waiting)) { clearTimeout(waiting[key]); const v = pending[key]; if (v) share(v.action, {key, title: v.title, kid: v.kid}); }
});

document.addEventListener("click", e => {
  const el = e.target;
  const x = el.closest("[data-remove]");
  if (x) return send("hide", JSON.parse(x.dataset.remove));
  if (el.closest("[data-lang]")) {
    LANG = ko() ? "en" : "ko";
    try { localStorage.setItem("school-lang", LANG); } catch {}
    return render();
  }
  const rp = el.closest("[data-report]");
  if (rp) {
    const box = rp.parentElement;
    if (box.querySelector(".reportbox")) return;
    const p = JSON.parse(rp.dataset.report);
    rp.insertAdjacentHTML("afterend", `<div class="reportbox"><label>What's wrong? (wrong date, wrong kid, not ours…)</label>
      <textarea rows="2"></textarea><div class="acts"><button class="btn primary" data-send>Send</button><button class="btn" data-cancel>Cancel</button></div></div>`);
    const rb = box.querySelector(".reportbox");
    rb.querySelector("textarea").focus();
    rb.querySelector("[data-cancel]").onclick = () => rb.remove();
    rb.querySelector("[data-send]").onclick = async () => {
      const note = rb.querySelector("textarea").value.trim();
      if (!note) return;
      const ok = await post({action: "feedback", ...p, note});
      rb.remove();
      toast(ok ? "Sent to the family Mac. Thanks!" : "Couldn't send. Check the connection and try again.");
    };
    return;
  }
  const rs = el.closest("[data-restore]");
  if (rs) return restore(JSON.parse(rs.dataset.restore));
  const act = el.closest("[data-act]");
  if (act) return send(act.dataset.act, JSON.parse(act.dataset.p));
  const tb = el.closest("[data-toggle-btn]");
  if (tb) { const it = tb.closest(".item"); it.classList.toggle("open"); tb.textContent = it.classList.contains("open") ? "Hide email" : "Full email"; return; }
  const tab = el.closest("[data-tab]");
  if (tab) return showKid(Number(tab.dataset.tab));
  if (el.closest("a,button,.confirm")) return;
  const row = el.closest("[data-toggle]");
  if (row) row.closest(".item").classList.toggle("open");
});

const GAP = 16;  // matches .track gap
function selectTab(n) {
  document.querySelectorAll("[data-tab]").forEach((b, i) => b.setAttribute("aria-selected", String(i === n)));
}
function showKid(n) {
  const track = document.getElementById("track");
  selectTab(n);
  track.scrollTo({left: (track.clientWidth + GAP) * n,
                  behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
document.addEventListener("scroll", e => {  // swiping updates the tabs
  if (e.target.id !== "track") return;
  const t = e.target;
  selectTab(Math.round(t.scrollLeft / (t.clientWidth + GAP)));
}, true);

// Coming back to the app: reload if the Mac has published a newer version since.
const BUILD = "20261019131552";
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || location.protocol !== "https:") return;
  try {
    const page = await (await fetch(location.pathname, {cache: "no-store"})).text();
    const m = page.match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD) location.reload();
  } catch { /* offline: keep what we have */ }
});

boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
